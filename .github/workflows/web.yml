name: Build and deploy explorer

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - "release/**"
      - "batches/**"
      - "corrections/**"
      - "metadata/codex-usage/**"
      - "analysis/notes/individual/**"
      - "analysis/tables/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "data/**"
      - "release/**"
      - "batches/**"
      - "corrections/**"
      - "metadata/codex-usage/**"
      - "analysis/notes/individual/**"
      - "analysis/tables/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        # Full artifact verification also gates publication, not just the UI build.
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify scientific release
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Check scientific release
        run: ruby tools/verify_release.rb
      - name: Check individual reviews
        run: |
          ruby analysis/src/check_winner_reviews.rb
          ruby analysis/src/check_opus55_reviews.rb
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Check website
        run: npm run check
        working-directory: web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run browser tests
        run: npm run test:e2e
        working-directory: web
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
