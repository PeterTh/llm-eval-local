name: Verify artifact

on:
  push:
    paths-ignore:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths-ignore:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: ruby tools/verify_release.rb
      - run: ruby tools/test_current_release.rb
      - run: ruby tools/test_batch_generation.rb
      - run: ruby tools/test_batch_audit_selection.rb
      - run: ruby analysis/src/check_winner_reviews.rb
      - run: ruby analysis/src/check_opus55_reviews.rb
      - run: ruby analysis/src/check_sol61_reviews.rb
